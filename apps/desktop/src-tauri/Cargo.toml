[package]
name = "savoir"
version = "0.1.0"
description = "Savoir — client desktop de la base de connaissance Echo (fork Karakeep)"
edition = "2021"
license = "AGPL-3.0"

[lib]
name = "savoir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
